name: Build APK

on:
  push:
    branches: [ main, master, 'arena/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK (cmdline-tools)
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          # cmdline-tools 13114758 (2025-06) — the 2024 build (11076708) cannot
          # install the android-37 platform used by compileSdk 37.
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q -d /tmp/cmdline-tools /tmp/cmdline-tools.zip
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
              "platform-tools" "platforms;android-37" "build-tools;34.0.0" "build-tools;36.0.0" \
              2>&1 | tee sdk-setup.log || {
                echo "::error title=SDK setup failed::sdkmanager could not install the Android SDK components"
                tail -n 30 sdk-setup.log | while IFS= read -r line; do
                  escaped=${line//'%'/'%25'}
                  escaped=${escaped//$'\r'/'%0D'}
                  echo "::error::$escaped"
                done
                exit 1
              }
          set +o pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --list_installed

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: on-failure
          gradle-version: "9.7.1"

      - name: Build debug APK
        run: |
          set +e
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --info --console=plain 2>&1 | tee build.log
          build_status=${PIPESTATUS[0]}
          echo "Gradle assembleDebug exit code: $build_status"
          exit "$build_status"

      - name: Report build diagnostics
        if: always()
        run: |
          diagnostic_pattern='^e: |^FAILURE:|^\* What went wrong:|^Execution failed for task|^> Task .* FAILED|^BUILD FAILED|^Caused by:'
          {
            echo "## Debug APK build diagnostics"
            echo
            echo '### Compiler and Gradle errors'
            echo '```text'
            if [ -f build.log ]; then
              grep -nE "$diagnostic_pattern" build.log | tail -n 120 || echo "No concise diagnostics found; see the log tail below."
            else
              echo "Build log was not created."
            fi
            echo '```'
            echo
            echo '### Build log tail'
            echo '```text'
            if [ -f build.log ]; then tail -n 100 build.log; else echo "No build log."; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f build.log ]; then
            while IFS= read -r diagnostic; do
              escaped=${diagnostic//'%'/'%25'}
              escaped=${escaped//$'\r'/'%0D'}
              echo "::error title=Build diagnostic::$escaped"
            done < <(grep -nE "$diagnostic_pattern" build.log | tail -n 60 || true)
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stormstream-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Build release APK (unsigned)
        run: gradle assembleRelease --no-daemon || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stormstream-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK (unsigned)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stormstream-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Publish release on tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stormstream-debug-apk
          path: apk/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
