name: Build APK

on:
  push:
    branches: [ main, master, 'arena/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK (cmdline-tools)
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q -d /tmp/cmdline-tools /tmp/cmdline-tools.zip
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
              "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --list_installed

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: on-failure
          gradle-version: "8.7"

      - name: Build debug APK
        id: build_debug
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --info --console=plain 2>&1 | tee build.log
          build_status=${PIPESTATUS[0]}
          echo "exit_code=$build_status" >> "$GITHUB_OUTPUT"
          echo "Gradle assembleDebug exit code: $build_status"
          exit 0

      - name: Report build diagnostics
        if: always()
        run: |
          {
            echo "## Debug APK build diagnostics"
            echo
            echo '```text'
            if [ -f build.log ]; then
              grep -nE '^e: |^w: |^FAILURE:|^\* What went wrong|^> Task .* FAILED|BUILD FAILED|Caused by:' build.log | head -100 || echo "No compiler or Gradle diagnostics captured."
            else
              echo "Build log was not created."
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -f build.log ]; then
            grep -E '^e: |^FAILURE:|^\* What went wrong|^> Task .* FAILED|BUILD FAILED|Caused by:' build.log | head -60 | while IFS= read -r diagnostic; do
              escaped=${diagnostic//'%'/'%25'}
              escaped=${escaped//$'\r'/'%0D'}
              escaped=${escaped//$'\n'/'%0A'}
              echo "::error title=Build diagnostic::$escaped"
            done
          fi

      - name: Fail when debug build fails
        if: steps.build_debug.outcome == 'failure'
        run: exit 1

      - name: Build release APK (unsigned)
        run: gradle assembleRelease --no-daemon || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stormstream-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK (unsigned)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stormstream-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Publish release on tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stormstream-debug-apk
          path: apk/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
