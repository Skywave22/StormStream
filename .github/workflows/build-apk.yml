name: Build APK

on:
  push:
    branches: [ main, master, 'arena/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android SDK (cmdline-tools, platform, build-tools)
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -fsSL -o /tmp/cmdline-tools.zip "$CMDLINE_URL"
          unzip -q -d /tmp/cmdline-tools /tmp/cmdline-tools.zip
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Setup Gradle (auto-installs wrapper if missing)
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: on-failure
          gradle-version: "8.9"
          generate-job-summary: true

      - name: Generate Gradle wrapper
        run: |
          set -e
          # The setup-gradle action puts a `gradle` command on PATH. Use it to
          # generate gradlew + gradle-wrapper.jar so subsequent steps use the
          # standard wrapper flow.
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew
          ls -la gradle/wrapper/
          ./gradlew --version

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee /tmp/build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}"
          grep -nE "^e: |^\* What went wrong|FAILURE:|BUILD FAILED" /tmp/build.log | head -40 || true
          tail -200 /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stormstream-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build release APK (unsigned)
        if: always()
        run: ./gradlew assembleRelease --stacktrace --no-daemon --console=plain || true

      - name: Upload release APK (unsigned)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stormstream-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Publish release on tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stormstream-debug-apk
          path: apk/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
